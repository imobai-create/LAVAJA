name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Este workflow não usa nenhum segredo: não faz deploy, não acessa banco, não usa token.
permissions:
  contents: read

jobs:
  build:
    name: Testes e sanidade do HTML
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Verificar o HTML de public/
        run: node .github/scripts/checar-html.mjs
